name: Build APK
on:
  push: { branches: [ main ] }
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o app.zip -d app
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - working-directory: app
        run: |
          npm install
          npx cap add android || true
          npx @capacitor/assets generate --android --assetPath assets || true
          npx cap sync android
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: starlyn-finance-apk, path: app/android/app/build/outputs/apk/debug/*.apk }
  web:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o app.zip -d app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/web }
      - id: deploy
        uses: actions/deploy-pages@v4
