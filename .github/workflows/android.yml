name: Build Android APK
on:
  push: { branches: [ main ] }
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip app.zip
        run: |
          set -e
          test -f app.zip || { echo "ERROR: app.zip not found in repo root"; exit 1; }
          rm -rf _build && mkdir _build
          unzip -q app.zip -d _build
          test -f _build/package.json || { echo "ERROR: package.json missing in app.zip"; exit 1; }
          test -f _build/capacitor.config.json || { echo "ERROR: capacitor.config.json missing in app.zip"; exit 1; }

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Install deps
        working-directory: _build
        run: npm install

      - name: Add Android platform
        working-directory: _build
        run: npx cap add android || true

      - name: Sync web into Android
        working-directory: _build
        run: npx cap sync android

      - name: Accept SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build debug APK
        working-directory: _build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: starlyn-finance-apk
          path: _build/android/app/build/outputs/apk/debug/*.apk
