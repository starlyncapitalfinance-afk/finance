name: Deploy Web (GitHub Pages)
on:
  push: { branches: [ main ] }
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip app.zip and locate web/
        run: |
          set -e
          test -f app.zip || { echo "ERROR: app.zip not found in repo root"; exit 1; }
          rm -rf _build && mkdir _build
          unzip -q app.zip -d _build
          WEB=$(find _build -maxdepth 3 -type d -name web | head -1)
          test -n "$WEB" || { echo "ERROR: no web/ folder inside app.zip"; exit 1; }
          test -f "$WEB/index.html" || { echo "ERROR: $WEB/index.html missing"; exit 1; }
          echo "WEB_DIR=$WEB" >> "$GITHUB_ENV"
          echo "Publishing from: $WEB"
          ls -la "$WEB"

      - name: Publish web/ to gh-pages branch (root)
        run: |
          set -e
          cd "$WEB_DIR"
          touch .nojekyll
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git branch -M gh-pages
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
